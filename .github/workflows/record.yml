name: Weather ETL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # run every 6 hours

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Fetch sources
        env:
          SRC_A:  ${{ secrets.MAIN_PY }}
          SRC_B:  ${{ secrets.CORE_PY }}
          SRC_C:  ${{ secrets.VENUES_PY }}
          SRC_D:  ${{ secrets.COMPACT_PY }}
        run: |
          echo "$SRC_A" | base64 -d > main.py
          echo "$SRC_B" | base64 -d > core.py
          echo "$SRC_C" | base64 -d > venues.py
          echo "$SRC_D" | base64 -d > compact.py
          echo "Sources ready"
          wc -l main.py core.py venues.py compact.py

      - name: Install requirements
        run: |
          pip install --quiet websockets pyarrow huggingface_hub numpy

      - name: Run pipeline (5h45m)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO:  ${{ secrets.HF_REPO }}
          SYMBOLS:  ${{ secrets.SYMBOLS }}
        run: |
          timeout 20700 python main.py || true

      - name: Schedule next run
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/moshebutika-del/weather-etl-pipeline/actions/workflows/record.yml/dispatches \
            -d '{"ref":"main"}' && echo "Next run scheduled" || echo "Schedule failed (cron fallback active)"
