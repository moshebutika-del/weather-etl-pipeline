name: Order Flow Recorder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # גיבוי: מופעל כל 6 שעות אם הממסר נכשל

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Decode scripts from secrets
        env:
          MAIN_PY:    ${{ secrets.MAIN_PY }}
          CORE_PY:    ${{ secrets.CORE_PY }}
          VENUES_PY:  ${{ secrets.VENUES_PY }}
          COMPACT_PY: ${{ secrets.COMPACT_PY }}
        run: |
          echo "$MAIN_PY"    | base64 -d > main.py
          echo "$CORE_PY"    | base64 -d > core.py
          echo "$VENUES_PY"  | base64 -d > venues.py
          echo "$COMPACT_PY" | base64 -d > compact.py
          echo "Scripts decoded OK"
          wc -l main.py core.py venues.py compact.py

      - name: Install dependencies
        run: |
          pip install --quiet websockets pyarrow huggingface_hub numpy

      - name: Record for 5h45m
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO:  ${{ secrets.HF_REPO }}
          SYMBOLS:  ${{ secrets.SYMBOLS }}
        run: |
          timeout 20700 python main.py || true

      - name: Trigger next run (relay)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/moshebutika-del/order-flow-runner/actions/workflows/record.yml/dispatches \
            -d '{"ref":"main"}' && echo "Next run triggered" || echo "Relay failed (cron fallback active)"
